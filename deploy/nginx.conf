# Mount dist at /usr/share/nginx/html. Expose port 8080 only to an HTTPS terminator.
# Replace api.internal:4000 with the private Go API upstream.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    add_header Content-Security-Policy-Report-Only "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https: wss:; frame-src https:; media-src 'self' https: blob:; form-action 'self'" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

    location /api/ {
        proxy_pass http://api.internal:4000;
        proxy_set_header Host $host;
        # The public connection is HTTPS even though the private proxy hop is HTTP.
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ~ \.map$ { return 404; }
    location / { try_files $uri $uri/ /index.html; }
}
