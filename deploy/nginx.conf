# Mount dist at /usr/share/nginx/html. Expose port 8080 only to an HTTPS terminator.
# Replace api.internal:4000 with the private Go API upstream.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    include /etc/nginx/security-headers.conf;

    location /api/ {
        proxy_pass http://api.internal:4000;
        proxy_set_header Host $host;
        # The public connection is HTTPS even though the private proxy hop is HTTP.
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /csp-report {
        access_log off;
        error_log /dev/null crit;
        client_max_body_size 16k;
        proxy_pass http://csp-reports:8081/csp-report;
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
    }

    location /assets/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    location ~ \.map$ { return 404; }
    location / { try_files $uri $uri/ /index.html; }
}
