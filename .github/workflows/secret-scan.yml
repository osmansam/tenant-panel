name: Secret scan

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22.22.0'
      - name: Test changed commit selection
        run: node --test scripts/secret-scan-range.test.mjs
      - name: Install gitleaks
        run: |
          version="8.24.2"
          archive="gitleaks_${version}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location "https://github.com/gitleaks/gitleaks/releases/download/v${version}/${archive}" --output "$RUNNER_TEMP/$archive"
          # Official v8.24.2 checksum, reviewed with this pinned version.
          printf '%s  %s\n' fa0500f6b7e41d28791ebc680f5dd9899cd42b58629218a5f041efa899151a8e "$RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C /usr/local/bin gitleaks
      - name: Scan working tree for secrets
        run: gitleaks detect --source . --no-git --redact --verbose
      - name: Scan pull request or pushed commit range
        run: node scripts/secret-scan-range.mjs
      - name: Scan main branch commits on push
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: gitleaks git --redact --verbose
