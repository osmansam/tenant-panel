name: Secret scan

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          version="8.24.2"
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz" | tar -xz -C /usr/local/bin gitleaks
      - name: Scan working tree for secrets
        run: gitleaks detect --source . --no-git --redact --verbose
      - name: Scan main branch commits on push
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: gitleaks git --redact --verbose
