name: Staging container smoke

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  container-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_RELEASE: ${{ github.sha }}
      VITE_API_URL: /api/v1
      VITE_RUNTIME_APP_URL: https://runtime.example.test
    steps:
      - uses: actions/checkout@v4
      - name: Build staging images from this SHA
        run: docker compose -f deploy/compose.staging.yml build
      - name: Start isolated hosting and report collector
        run: docker compose -f deploy/compose.staging.yml up -d
      - name: Validate nginx and actual response headers
        run: |
          docker compose -f deploy/compose.staging.yml exec -T panel nginx -t
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/login > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent --head http://127.0.0.1:8080/login > /tmp/panel-headers
          grep -i '^X-Frame-Options: DENY' /tmp/panel-headers
          grep -i '^X-Robots-Tag: noindex, nofollow' /tmp/panel-headers
          grep -i '^Content-Security-Policy-Report-Only:.*report-uri /csp-report' /tmp/panel-headers
          grep -i '^Cache-Control: no-cache' /tmp/panel-headers
          asset=$(curl --fail --silent http://127.0.0.1:8080/login | sed -n 's/.*src="\(\/assets\/[^" ]*\.js\)".*/\1/p' | head -1)
          test -n "$asset"
          curl --fail --silent --head "http://127.0.0.1:8080$asset" > /tmp/asset-headers
          grep -i '^Cache-Control: public, max-age=31536000, immutable' /tmp/asset-headers
          grep -i '^X-Frame-Options: DENY' /tmp/asset-headers
          code=$(curl --silent --output /dev/null --write-out '%{http_code}' --header 'Content-Type: application/csp-report' --data '{"csp-report":{"effective-directive":"script-src","disposition":"report","status-code":200}}' http://127.0.0.1:8080/csp-report)
          test "$code" = 204
      - name: Show hosting failure logs
        if: failure()
        run: docker compose -f deploy/compose.staging.yml logs
      - name: Stop task-owned containers
        if: always()
        run: docker compose -f deploy/compose.staging.yml down --volumes
