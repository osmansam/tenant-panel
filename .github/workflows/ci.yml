name: Verify tenant panel

on:
  pull_request:
  push:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-check:
    name: Release checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
      - name: Enable pinned Yarn
        run: corepack enable
      - name: Install locked dependencies
        run: yarn install --immutable
      - name: Audit high-severity dependencies
        run: yarn audit:high
      - name: Lint, test, build and enforce bundle budget
        run: yarn release:check
      - name: Upload measured coverage and lcov
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ github.sha }}
          path: |
            coverage/lcov.info
            coverage/coverage-summary.json
          if-no-files-found: error
          retention-days: 14
